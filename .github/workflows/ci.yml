name: CI

on:
  push:
    branches:
      - main
      - canary
  pull_request:
  workflow_dispatch:

env:
  IMAGE_REPO: ghcr.io/chatsift/chatsift

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        uses: ./actions/yarnCache

      - name: Build
        run: yarn build

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn format:check

      - name: Test
        run: yarn test

  build-push:
    name: Build & push image
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      IMAGE_CHANNEL: ${{ github.ref_name }}
      ROOT_IMAGE_INPUTS: >-
        .dockerignore .gitattributes .yarn .yarnrc.yml Dockerfile package.json tsconfig.base.json
        tsconfig.json tsup.config.ts turbo.json yarn.lock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the range below spans the whole push, and turbo's `[base...HEAD]` filter
          # needs a merge base.
          fetch-depth: 0

      - name: Detect what needs rebuilding
        id: changed
        env:
          BASE: ${{ github.event.before }}
        run: |
          # An unresolvable range -- manual dispatch, a branch's first push, a force-pushed base that
          # is gone -- rebuilds everything, so the failure mode is a wasted build, never a missed one.
          if [ "${{ github.event_name }}" != 'push' ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo 'no resolvable push range -- rebuilding everything'
            echo 'base=' >> "$GITHUB_OUTPUT"
            echo 'app=true' >> "$GITHUB_OUTPUT"
            echo 'ingress=true' >> "$GITHUB_OUTPUT"
            echo 'backup=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base=$BASE" >> "$GITHUB_OUTPUT"

          # ROOT_IMAGE_INPUTS is a space-separated pathspec list, so it stays unquoted here.
          if git diff --quiet "$BASE" HEAD -- packages services $ROOT_IMAGE_INPUTS; then
            echo 'nothing that lands in the image changed -- skipping the build'
            echo 'app=false' >> "$GITHUB_OUTPUT"
          else
            echo 'app=true' >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE" HEAD -- build/caddy; then
            echo 'ingress=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ingress=true' >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE" HEAD -- build/pg-backup; then
            echo 'backup=false' >> "$GITHUB_OUTPUT"
          else
            echo 'backup=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install node.js
        if: steps.changed.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        if: steps.changed.outputs.app == 'true' || steps.changed.outputs.ingress == 'true' || steps.changed.outputs.backup == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changed.outputs.app == 'true' || steps.changed.outputs.ingress == 'true' || steps.changed.outputs.backup == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install dependencies
        if: steps.changed.outputs.app == 'true'
        uses: ./actions/yarnCache

      - name: Build and push
        if: steps.changed.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_CHANNEL }}-${{ github.sha }}
          build-args: |
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}

      - name: Alias changed services
        if: steps.changed.outputs.app == 'true'
        env:
          BASE: ${{ steps.changed.outputs.base }}
        run: |
          if [ -z "$BASE" ]; then
            echo 'no resolvable push range -- aliasing every service'
            yarn turbo run tag-docker
          elif ! git diff --quiet "$BASE" HEAD -- $ROOT_IMAGE_INPUTS; then
            echo 'a root build input changed -- aliasing every service'
            yarn turbo run tag-docker
          else
            yarn turbo run tag-docker --filter "...[${BASE}...HEAD]"
          fi

      - name: Build and push ingress image
        if: steps.changed.outputs.ingress == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./build/caddy
          file: ./build/caddy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_CHANNEL }}-caddy
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_CHANNEL }}-caddy-${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Build and push pg-backup image
        if: steps.changed.outputs.backup == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./build/pg-backup
          file: ./build/pg-backup/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_CHANNEL }}-pg-backup
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_CHANNEL }}-pg-backup-${{ github.sha }}
          cache-from: type=gha,scope=pg-backup
          cache-to: type=gha,mode=max,scope=pg-backup

  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key rather than StrictHostKeyChecking=no -- this box runs production
          # workloads beyond ChatSift, so an unauthenticated first connection is not acceptable.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "deploys@${DEPLOY_HOST}" "${{ github.ref_name }}"

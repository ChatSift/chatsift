apiVersion: 1

# Removes the old Loki-backed "elevated-error-log-rate" rule, which file provisioning alone
# won't retract once it's already in Grafana's DB (grafana-data volume) - it only reconciles
# adds/updates against what's in `groups:` below, never deletes what's missing from it.
deleteRules:
  - orgId: 1
    uid: elevated-error-log-rate

groups:
  - orgId: 1
    name: chatsift-alerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: container-restarted
        title: Container restarted
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'A container (re)started within the last 5 minutes - this also fires on normal deploys/restarts, not just crashes, since cadvisor start-time data cannot distinguish the two'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: time() - container_start_time_seconds{name=~".*(api|ama-bot).*"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [300]

      - uid: host-disk-space-low
        title: Host disk space low
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Host disk space below 10%'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]

      # #270 - postgres query performance tracking. Backed by the postgres-exporter service
      # (docker-compose.yml) scraped by prometheus (build/prometheus/prometheus.yml).
      - uid: postgres-down
        title: Postgres down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'postgres-exporter cannot reach Postgres (pg_up == 0) for at least 2 minutes'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: pg_up
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: postgres-connections-near-limit
        title: Postgres connections near limit
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Active Postgres connections are above 80% of max_connections for at least 5 minutes'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: sum(pg_stat_database_numbackends) / pg_settings_max_connections
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]

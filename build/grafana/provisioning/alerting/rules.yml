apiVersion: 1

# Retires rules by uid. File provisioning alone won't retract a rule once it's already in
# Grafana's DB (grafana-data volume) - it only reconciles adds/updates against what's in
# `groups:` below, never deletes what's missing from it.
deleteRules:
  # The old Loki-backed error-rate rule.
  - orgId: 1
    uid: elevated-error-log-rate
  # Superseded by `container-crashlooping` below, which is the same idea done in a way that
  # doesn't also fire on every normal deploy.
  - orgId: 1
    uid: container-restarted

groups:
  - orgId: 1
    name: chatsift-alerts
    folder: Alerts
    interval: 1m
    rules:
      # Replaces the old `container-restarted` rule, which measured how *recently* a container
      # started and so fired identically on a healthy deploy and on a crashloop. That cost us the
      # 2026-08-11 incident: a PR added a mandatory env var (SOCIAL_BOT_TOKEN) that was never added
      # to the host's .env.private, every service died inside `envSchema.parse` at import time --
      # before its logger or fatal handlers existed -- and `restart: unless-stopped` looped them all
      # night. The alert did its job and was ignored, because it looked exactly like the routine
      # post-deploy ping.
      #
      # Counting restarts instead separates the two cases for free: `restart: unless-stopped`
      # restarts the *same* container, so the cadvisor series keeps its `id` label and `changes()`
      # counts every loop; a `docker compose up` redeploy *creates* a container, so its series is
      # brand new and `changes()` over it is 0. Deploys stay silent, loops page.
      #
      # Grafana is also the only alert path that survives the API being down -- it posts to Discord
      # itself (contact-points.yml), whereas the Dozzle log relay routes through the API's own
      # /v3/logs/webhook route and dies with it.
      - uid: container-crashlooping
        title: Container crashlooping
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'A container restarted more than 3 times in 10 minutes - it is crashlooping, not being deployed. Check `docker compose ps` for which one, then Dozzle for the exit reason (a mandatory env var missing from .env.private is the known repeat offender).'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              # `modmail-bot` covers both the public container and every custom instance
              # (`modmail-bot-nascar`, etc.) -- the previous regex matched neither.
              expr: changes(container_start_time_seconds{name=~".*(api|ama-bot|modmail-bot).*"}[10m])
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    # Docker's restart backoff caps at ~60s, so a genuine loop clears 3 starts
                    # within roughly the first two minutes and then stays above it. No legitimate
                    # restart -- including a --force-recreate -- gets near this.
                    type: gt
                    params: [3]

      - uid: host-disk-space-low
        title: Host disk space low
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Host disk space below 10%'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.1]

      # #270 - postgres query performance tracking. Backed by the postgres-exporter service
      # (docker-compose.yml) scraped by prometheus (build/prometheus/prometheus.yml).
      - uid: postgres-down
        title: Postgres down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'postgres-exporter cannot reach Postgres (pg_up == 0) for at least 2 minutes'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: pg_up
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: postgres-connections-near-limit
        title: Postgres connections near limit
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'Active Postgres connections are above 80% of max_connections for at least 5 minutes'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: sum(pg_stat_database_numbackends) / pg_settings_max_connections
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: '__expr__'
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]

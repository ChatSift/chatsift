services:
  caddy:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-caddy
    build:
      context: ./build/caddy
      dockerfile: ./Dockerfile
    profiles: ['ingress']
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT}
      CF_API_TOKEN: ${CF_API_TOKEN}
    ports:
      - '80:80'
      - '443:443'
    networks:
      - default
      - legacy
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: 'chatsift'
      POSTGRES_PASSWORD: 'admin'
      POSTGRES_DB: 'chatsift'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Only runs against a fresh data directory - already-provisioned volumes need the manual
      # one-time step documented in docs/workflow.md.
      - ./build/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'pg_stat_statements.track=all'
      - '-c'
      - 'pg_stat_statements.max=5000'
      - '-c'
      - 'log_min_duration_statement=${POSTGRES_SLOW_QUERY_LOG_MS:-200}'
      # Bound parameter *values* would otherwise be logged alongside a slow statement (Postgres's
      # default) - queries here are parameterized user/message data (Discord IDs, ticket content,
      # snippet text, ...), so only the query shape ($1, $2, ...) goes to dozzle, never the values.
      - '-c'
      - 'log_parameter_max_length=0'
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    ports:
      - 127.0.0.1:${LOCAL_DATABASE_PORT}:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatsift']
      interval: 10s
      timeout: 5s

  # Nightly logical backups of the whole cluster to S3 (see build/pg-backup/backup.sh for why restic,
  # and docs/workflow.md for the restore runbook). Profile-gated so only prod takes them -- a canary or
  # dev checkout that started this would write its own throwaway data into the production repository.
  #
  # The `depends_on` below only orders startup. It is not what keeps backups correct at 03:00 -- a
  # Postgres that is down then surfaces as a failed run on stderr, retried a few times, rather than as a
  # container that quietly gave up.
  pg-backup:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-pg-backup
    build:
      context: ./build/pg-backup
      dockerfile: ./Dockerfile
    profiles: ['backup']
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    environment:
      # The S3 credentials are spelled BACKUP_* in .env.private and only mapped onto the names the AWS
      # SDKs look for here. Both files are loaded by every service in this file, so an unprefixed
      # AWS_ACCESS_KEY_ID would put working bucket credentials into the environment of every bot that
      # processes untrusted Discord input, where any library that happens to construct an AWS client
      # would pick them up ambiently. The prefixed copies are still there; nothing can use them by
      # accident.
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
      # Optional -- restic resolves the bucket's region on its own when this is blank.
      AWS_DEFAULT_REGION: ${BACKUP_AWS_REGION:-}
      RESTIC_REPOSITORY: 's3:${BACKUP_S3_ENDPOINT}/${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}'
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD}
      # Onto the volume, not the container's $HOME: restic re-reads the repository index on every prune,
      # and a cache thrown away on each redeploy would re-download it from S3 every time.
      RESTIC_CACHE_DIR: /var/lib/pg-backup/cache
      # Same source of truth as the `postgres` service above, which spells its own credentials inline
      # the same way. `chatsift` is the cluster superuser, which pg_dumpall --globals-only requires.
      PGHOST: postgres
      PGUSER: chatsift
      PGPASSWORD: admin
    volumes:
      - pg-backup-state:/var/lib/pg-backup
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ['monitoring']
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    environment:
      DATA_SOURCE_NAME: 'postgres://chatsift_exporter:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/chatsift?sslmode=disable'
    command:
      - '--collector.stat_statements'
      - '--collector.stat_statements.include_query'
      - '--collector.stat_statements.query_length=200'
      - '--collector.stat_statements.limit=20'
      - '--collector.stat_statements.exclude_users=chatsift_exporter,glitchtip'
    depends_on:
      - postgres

  dozzle:
    image: amir20/dozzle:latest
    profiles: ['monitoring']
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle-data:/data
    environment:
      DOZZLE_ENABLE_ACTIONS: true
      # Dozzle's own built-in auth (bcrypt users.yml in the dozzle-data volume). One-time setup
      # since dozzle-data is a named volume, not a bind mount:
      #   docker run --rm amir20/dozzle generate <username> --password '<password>' \
      #     | docker run -i --rm -v chatsift-v3-dozzle-data:/data alpine sh -c 'cat > /data/users.yml'
      DOZZLE_AUTH_PROVIDER: simple

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ['monitoring']
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # cAdvisor's own docker client needs this directly for container discovery - its remote/
      # TCP docker-host support is flaky. Already privileged with deep host mounts above, so
      # the marginal risk of this on top is small; not internet-facing regardless.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ['monitoring']
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ['monitoring']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=180d'
      - '--storage.tsdb.retention.size=15GB'
    volumes:
      - ./build/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./build/prometheus/metrics_secret:/etc/prometheus/metrics_secret:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - cadvisor
      - node-exporter
      - postgres-exporter

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ['monitoring']
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    environment:
      GF_SERVER_ROOT_URL: https://grafana.automoderator.app/
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Discord OAuth is the only sign-in path - GRAFANA_ADMIN_PASSWORD still exists as a
      # break-glass account, just not reachable via login UI or basic auth. Recovery if OAuth
      # ever misconfigures: flip these back via SSH and `./compose up -d --force-recreate grafana`.
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      # Discord's OAuth2 has no `sub` claim (just a plain `id` field), so Grafana can't match
      # returning users the normal way and tries to recreate them on every re-login, colliding
      # with the existing account. This falls back to matching by email. Safe here specifically
      # because ROLE_ATTRIBUTE_STRICT + the ADMINS-derived allowlist above is the actual access
      # boundary - only already-allowlisted Discord IDs ever get a role at all.
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: 'true'
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_NAME: Discord
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${OAUTH_DISCORD_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${OAUTH_DISCORD_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: 'identify email'
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://discord.com/api/oauth2/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://discord.com/api/oauth2/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://discord.com/api/users/@me
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: 'true'
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: 'true'
      # Derived from ADMINS by ./compose - only those Discord user IDs can log in.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: ${GRAFANA_OAUTH_ROLE_ATTRIBUTE_PATH}
    volumes:
      - ./build/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./build/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Frontend error reporting (#386). GlitchTip speaks the Sentry protocol, so `apps/website` uses the
  # stock `@sentry/nextjs` SDK while the events -- and crucially the uploaded source maps -- stay on our
  # own host. That is the whole point of it: holding the maps privately is what lets
  # `productionBrowserSourceMaps` come out of next.config.mjs without every production stack trace going
  # minified. See docs/adr/0003-frontend-error-reporting.md.
  #
  # The dashboard deploys to Vercel, not here, so this is the one service in this file whose clients are
  # entirely outside the compose network -- hence a public Caddy route rather than an internal-only port.
  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    profiles: ['monitoring']
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@postgres:5432/glitchtip
      # A load-bearing empty string, NOT an omission. Blank means "use Postgres for the task queue and
      # cache as well", which is what keeps this off the shared `redis` service. That Redis runs with no
      # `maxmemory` and holds bot-core's replica leases, the per-replica guild lists and the message
      # cache; adding a Celery broker to it is how a lease gets evicted and two replicas end up claiming
      # the same shard index. Do not "tidy this up" by pointing it at redis://redis:6379.
      #
      # The catch, on a fresh install: Django's cache backend becomes the database, and that needs a
      # `django_cache` table which `migrate` does NOT create -- `manage.py createcachetable` does. Nothing
      # reads the cache until something does, so the install looks complete and then 500s on the first
      # login (allauth rate-limits there). See docs/workflow.md.
      VALKEY_URL: ''
      # Runs migrations, the web server and the worker in one container -- the right trade at this volume
      # (a single dashboard and a handful of admins), and the role the upstream sample compose ships.
      #
      # It is also what applies migrations at boot, and leaving it unset does NOT fall back to something
      # sensible: the container comes up as a plain web role, serves perfectly happily, and never
      # migrates. The first `createsuperuser` then runs against a schema that does not exist, and the
      # only hint is a "you have N unapplied migration(s)" warning printed by an unrelated command. That
      # is exactly how the #386 cutover went, and it would have recurred silently on every version bump.
      SERVER_ROLE: all_in_one
      # Django defaults to 20. `postgres-connections-near-limit` already watches the shared instance, and
      # a new tenant should not quietly take a fifth of max_connections.
      DATABASE_POOL_MAX_SIZE: 5
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.automoderator.app
      # Not derived from GLITCHTIP_DOMAIN above -- GlitchTip warns on every boot that this defaults to the
      # wildcard, which on an internet-facing host means Django will answer to any Host header. That is
      # what makes a poisoned absolute URL (a password reset link, a cached asset path) possible.
      ALLOWED_HOSTS: errors.automoderator.app
      DEFAULT_FROM_EMAIL: noreply@automoderator.app
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      # It sits on a public host, so nobody outside gets to sign up or create orgs. Registration defaults
      # to True upstream, so it has to be turned off explicitly rather than simply left unset.
      ENABLE_USER_REGISTRATION: 'False'
      ENABLE_ORGANIZATION_CREATION: 'False'
      # OTLP log ingestion. Loki and Promtail were deliberately removed (1ef4c014, 6e56307d) and the
      # Loki-backed alert retired in rules.yml -- do not reintroduce a log store through a side door.
      GLITCHTIP_ENABLE_LOGS: 'False'
      # Grafana already owns uptime alerting, this container included (see rules.yml).
      GLITCHTIP_ENABLE_UPTIME: 'False'
      # Events land in the *product* Postgres, so retention is a disk-pressure decision rather than a
      # preference. Starts below the upstream default of 90.
      GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-30}
    volumes:
      - glitchtip-uploads:/code/uploads
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    # Nothing in the stack treats Redis as a source of truth (GuildList/instance snapshots republish on an
    # interval, PendingTicketStore mirrors the durable `pending_tickets` table, grant-token claims are
    # best-effort) -- so it runs fully in-memory: no RDB snapshotting (`--save ''`), no AOF. Removes the only
    # disk-backed state that would otherwise need at-rest encryption, and skips the fsync/bgsave overhead.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 10s
      timeout: 5s
    ports:
      - 127.0.0.1:${LOCAL_REDIS_PORT}:6379

  # The single rate-limit accountant in front of Discord's REST API -- see
  # docs/roadmap/01-architecture.md §9. Every bot token is in use from two processes (its own `*-bot`
  # service and `api`), and `@discordjs/rest` keeps bucket state per instance, so without this each token
  # has two accountants that each only see half of what it actually sent. One process serves every token:
  # it partitions its state by the inbound `Authorization` header, which is also why onboarding a custom
  # ModMail instance (with its own token, added at runtime) needs no change here.
  #
  # Deliberately not published to the host, unlike `api`/`redis`: bot tokens cross this hop.
  discord-proxy:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-discord-proxy
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    command: ['node', '--enable-source-maps', './services/discord-proxy/dist/bin.js']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${DISCORD_PROXY_PORT}/health']
      interval: 10s
      timeout: 5s
    volumes:
      - ./logs/discord-proxy:/usr/chatsift/logs/discord-proxy

  api:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-api
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    # Every client waits for the proxy rather than racing it: `REST` clients are built at import time, and a
    # base URL that isn't listening yet would have the process flap on startup. Note this stays in place even
    # when the proxy is switched off -- the kill switch is unsetting `DISCORD_PROXY_URL_PROD`, which sends
    # every client straight back to discord.com while this container keeps sitting there idle.
    depends_on:
      discord-proxy:
        condition: service_healthy
    command: ['node', '--enable-source-maps', './services/api/dist/bin.js']
    volumes:
      - ./logs/api:/usr/chatsift/logs/api

  ama-bot:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-ama
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    depends_on:
      discord-proxy:
        condition: service_healthy
    # Maps the per-bot value from the env files onto the generic name bot-core reads, so `./compose` can
    # size this service's replica count from it while the container itself stays bot-agnostic. Unset means
    # one replica running every shard. `./compose up` computes `--scale` from the same value.
    environment:
      SHARDS_PER_REPLICA: ${AMA_SHARDS_PER_REPLICA:-}
    command: ['node', '--enable-source-maps', './services/ama-bot/dist/bin.js']
    volumes:
      - ./logs/ama-bot:/usr/chatsift/logs/ama-bot

  modmail-bot:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-modmail
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    depends_on:
      discord-proxy:
        condition: service_healthy
    environment:
      SHARDS_PER_REPLICA: ${MODMAIL_SHARDS_PER_REPLICA:-}
    command: ['node', '--enable-source-maps', './services/modmail-bot/dist/bin.js']
    volumes:
      - ./logs/modmail-bot:/usr/chatsift/logs/modmail-bot

  social-bot:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-social
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    depends_on:
      discord-proxy:
        condition: service_healthy
    environment:
      SHARDS_PER_REPLICA: ${SOCIAL_SHARDS_PER_REPLICA:-}
    command: ['node', '--enable-source-maps', './services/social-bot/dist/bin.js']
    volumes:
      - ./logs/social-bot:/usr/chatsift/logs/social-bot

  # docs/roadmap/09-appeals.md. The thinnest bot here: no commands, and it posts nothing until an appeal is
  # filed. It holds a gateway connection for exactly two things HTTP cannot give it -- a correct guild list,
  # and ban-list events (#232, decision 2 as superseded).
  appeals-bot:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-appeals
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    depends_on:
      discord-proxy:
        condition: service_healthy
    environment:
      SHARDS_PER_REPLICA: ${APPEALS_SHARDS_PER_REPLICA:-}
    command: ['node', '--enable-source-maps', './services/appeals-bot/dist/bin.js']
    volumes:
      - ./logs/appeals-bot:/usr/chatsift/logs/appeals-bot

  # docs/roadmap/11-automoderator-port.md. Additive until P9 -- legacy AutoModerator keeps running from
  # ChatSift/stack against postgres-old the whole time this one is being built, so the two coexist and this
  # service must not be pointed at the legacy application's token before that cutover.
  automoderator-bot:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-automoderator
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    depends_on:
      discord-proxy:
        condition: service_healthy
    environment:
      SHARDS_PER_REPLICA: ${AUTOMODERATOR_SHARDS_PER_REPLICA:-}
    command: ['node', '--enable-source-maps', './services/automoderator-bot/dist/bin.js']
    volumes:
      - ./logs/automoderator-bot:/usr/chatsift/logs/automoderator-bot

  # Template for a branded, single-guild ModMail deployment (#216) -- see
  # docs/roadmap/01-architecture.md §8 and the onboarding/offboarding runbook in
  # docs/workflow.md. Copy this block once per approved partner (one block per instance -- these are
  # hand-managed, not self-serve, see decision 1 in the roadmap doc), replacing `<partner-slug>`
  # throughout with that partner's `modmail_instances.id` row. Everything else (image, build context,
  # env files) is identical to the public `modmail-bot` service above; `MODMAIL_INSTANCE_ID` is the only
  # thing that locks this process to that one guild/token.
  # modmail-bot-<partner-slug>:
  #   image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-modmail
  #   build:
  #     context: ./
  #     dockerfile: ./Dockerfile
  #   restart: unless-stopped
  #   env_file:
  #     - ./.env.public
  #     - ./.env.private
  #   environment:
  #     MODMAIL_INSTANCE_ID: '<partner-slug>'
  #   depends_on:
  #     discord-proxy:
  #       condition: service_healthy
  #   command: ['node', '--enable-source-maps', './services/modmail-bot/dist/bin.js']
  #   volumes:
  #     - ./logs/modmail-bot-<partner-slug>:/usr/chatsift/logs/modmail-bot-<partner-slug>

  # First real instance of the template above, and the first partner onboarded with pre-existing
  # legacy history (migrated 2026-08-12, `--source nascar`). Runs as their *legacy* application's
  # bot user rather than a fresh one, so their members keep the same DM correspondent -- which means
  # their old self-hosted deployment must never run again: same token, same gateway identity.
  modmail-bot-nascar:
    image: ghcr.io/chatsift/chatsift:${IMAGE_CHANNEL:-main}-modmail
    build:
      context: ./
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.public
      - ./.env.private
    environment:
      MODMAIL_INSTANCE_ID: 'nascar'
    depends_on:
      discord-proxy:
        condition: service_healthy
    command: ['node', '--enable-source-maps', './services/modmail-bot/dist/bin.js']
    volumes:
      - ./logs/modmail-bot-nascar:/usr/chatsift/logs/modmail-bot-nascar

volumes:
  caddy-data:
    name: 'chatsift-caddy-data'
    external: true
  caddy-config:
    name: 'chatsift-caddy-config'
    external: true

  postgres-data:
    name: '${RESOURCE_PREFIX}-postgres-data'
  dozzle-data:
    name: '${RESOURCE_PREFIX}-dozzle-data'
  prometheus-data:
    name: '${RESOURCE_PREFIX}-prometheus-data'
  grafana-data:
    name: '${RESOURCE_PREFIX}-grafana-data'
  glitchtip-uploads:
    name: '${RESOURCE_PREFIX}-glitchtip-uploads'
  # restic's cache plus the scratch directory the dumps are written to before being stored. Holds no
  # backup of its own -- losing it costs one slow run, not any data.
  pg-backup-state:
    name: '${RESOURCE_PREFIX}-pg-backup-state'

networks:
  default:
    name: ${RESOURCE_PREFIX}
  legacy:
    name: chatsift
    external: true
